<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pixel Code Studio</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101920;color:#dce9dc;font:14px system-ui;display:grid;place-items:center;min-height:100vh}main{width:min(96vw,1280px)}canvas{width:100%;display:block;image-rendering:pixelated}nav{display:flex;gap:16px;padding:16px 0;align-items:center}input{flex:1}button{padding:9px 18px;background:#d7ef80;border:0;border-radius:4px;color:#152531}span{font-variant-numeric:tabular-nums}
</style></head>
<body><main><canvas id="film"></canvas><nav><button id="play">播放</button><input id="seek" type="range" min="0" max="6" step="0.033333"><span id="time">0.00 s</span></nav></main>
<script type="module" src="./src/film.js"></script>
</body></html>
